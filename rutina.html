<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi rutina</title>
<meta name="robots" content="noindex, nofollow">

<!-- marca.js define y aplica el nombre/colores de este cliente -->
<script src="js/marca.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/iconos/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  /* Página suelta, sin sidebar/topbar — pensada para abrir desde el QR
     único del gimnasio, sin login. */
  .contenedor-rutina-publica { max-width: 640px; margin: 0 auto; padding: 1.6rem 1.1rem 3rem; }
  .encabezado-rutina-publica { text-align: center; margin-bottom: 1.4rem; }
  .encabezado-rutina-publica img { width: 56px; height: 56px; border-radius: 50%; margin-bottom: .6rem; }
  .barra-carga-mini { height: 8px; border-radius: 4px; background: var(--color-acento); margin-top: .3rem; }
</style>
</head>
<body>

<div class="contenedor-rutina-publica">
  <div class="encabezado-rutina-publica">
    <img src="assets/iconos/logo-mark.png" alt="">
    <h1 style="margin-bottom:.1rem"><span data-marca="nombre"></span><strong data-marca="sufijo"></strong></h1>
    <p class="texto-suave">Escribí tu DNI para ver tu rutina</p>
  </div>

  <div class="panel" style="margin-bottom:1.2rem">
    <div class="campo-fila">
      <label class="campo" style="flex:1"><span>DNI</span><input type="text" id="input-dni-publico" inputmode="numeric" placeholder="Ej: 30123456" autofocus></label>
      <button class="btn btn-primario" id="btn-buscar-dni-publico" style="align-self:flex-end">Ver mi rutina</button>
    </div>
    <p id="error-dni-publico" class="auth-error" hidden style="margin-top:.6rem"></p>
  </div>

  <div id="contenido-rutina-publica"></div>
</div>

<!-- Firebase (compat) — lectura/escritura pública limitada según firestore.rules, sin login -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="js/database.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/rutina-publica.js"></script>

</body>
</html>
